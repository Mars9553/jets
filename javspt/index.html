<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="E-Board">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-TileImage" content="/public/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/public/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #ffffff;
        }
        #e-board-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
        }
        .loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 12px;
        }
        .loading-text {
            font-size: 16px;
            color: #64748b;
        }
        #landing-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .landing-container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .landing-brand-block {
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }
        .landing-icon-bg {
            border-radius: 16px;
            background-color: #3b82f6;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .landing-logo {
            font-size: 24px;
            font-weight: 800;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .landing-tagline {
            font-size: 14px;
            color: #64748b;
        }
        .landing-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            border: 1px solid #e2e8f0;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .landing-card-title {
            font-size: 20px;
            font-weight: 700;
            font-family: system-ui, -apple-system, sans-serif;
            color: #334155;
            margin-bottom: 12px;
            text-align: center;
        }
        .landing-card-desc {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .landing-primary-button {
            width: 100%;
            background-color: #3b82f6;
            border-radius: 12px;
            padding: 14px;
            align-items: center;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }
        .landing-primary-button-text {
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
        }
        .landing-button-hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div id="install-banner" style="display: none;">
        <div class="install-banner-content">
            <div class="install-banner-icon">
                <img src="/public/icons/icon-512.png" alt="E-Board">
            </div>
            <div class="install-banner-text">
                <strong>E-Board</strong>
                <span>Add to Home Screen for quick access</span>
            </div>
            <div class="install-banner-actions">
                <button id="install-dismiss" class="install-btn install-btn-dismiss">Not now</button>
                <button id="install-accept" class="install-btn install-btn-accept">Add</button>
            </div>
        </div>
    </div>

    <div id="landing-page">
        <div class="landing-container">
            <div class="landing-brand-block">
                <div class="landing-icon-bg">
                    <span style="color: white; font-size: 24px;">🔔</span>
                </div>
                <div class="landing-logo">E-Board</div>
                <div class="landing-tagline">Campus notices & events</div>
            </div>
            
            <div class="landing-card">
                <div class="landing-card-title">Welcome to E-Board</div>
                <div class="landing-card-desc">
                    The official portal for all campus notices, memos, lectures, and upcoming student events.
                </div>
                
                <div class="landing-primary-button" onclick="router.push('/auth')">
                    <div class="landing-primary-button-text">Get Started</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        const { useState, useEffect } = React;
        const router = {
            push: (path) => {
                console.log('Navigate to:', path);
                window.location.href = path;
            }
        };
        
        function LandingPage() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                setTimeout(() => {
                    setLoading(false);
                    if (user) {
                        router.push('/user_notice');
                    }
                }, 1000);
            }, [user]);
            
            if (loading) {
                return (
                    <div className="loading-screen">
                        <div style="width: 40px;height: 40px;border-radius: 8px;background-color: #3b82f6;align-items: center;justify-content: center;display: flex;">
                            <span style="color: white; font-size: 24px;">🔔</span>
                        </div>
                        <p className="loading-text">Loading portal...</p>
                    </div>
                );
            }
            
            return (
                <div id="landing-page">
                    <div class="landing-container">
                        <div class="landing-brand-block">
                            <div class="landing-icon-bg">
                                <span style="color: white; font-size: 24px;">🔔</span>
                            </div>
                            <div class="landing-logo">E-Board</div>
                            <div class="landing-tagline">Campus notices & events</div>
                        </div>
                        
                        <div class="landing-card">
                            <div class="landing-card-title">Welcome to E-Board</div>
                            <div class="landing-card-desc">
                                The official portal for all campus notices, memos, lectures, and upcoming student events.
                            </div>
                            
                            <div class="landing-primary-button" onclick="router.push('/auth')">
                                <div class="landing-primary-button-text">Get Started</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<LandingPage />, document.body);
        
        const button = document.querySelector('.landing-primary-button');
        button.addEventListener('mouseenter', () => {
            button.classList.add('landing-button-hover');
        });
        button.addEventListener('mouseleave', () => {
            button.classList.remove('landing-button-hover');
        });
    </script>
    
    <script src="uno.js"></script>
</body>
</html>
